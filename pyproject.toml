[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-sequence-model"
version = "0.1.0"
description = "Reusable foundations for sequence-model research."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pydantic==2.12.5", "PyYAML==6.0.3"]

[dependency-groups]
dev = [
    "pre-commit==4.2.0",
    "pytest==8.4.2",
    "ruff==0.11.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
